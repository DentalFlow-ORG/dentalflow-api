name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    env:
      # Fixed, obviously-fake values. `test/jest-unit-setup.ts` supplies the
      # same defaults; they are repeated here so a failure reads as a missing
      # variable rather than a mysterious one. No real credential belongs in
      # this file — the unit suite never reaches a real service.
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-a-real-secret
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/dentalflow_ci
      WHATSAPP_VERIFY_TOKEN: ci-whatsapp-verify-token

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bun run prisma:validate

      - name: Type check
        run: bun run typecheck

      - name: Unit and application tests, with coverage
        # Coverage thresholds live in package.json and fail this step on
        # regression.
        run: bun run test:cov

      - name: Dead-code analysis
        run: bun run deadcode

      - name: Build
        run: bun run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Blocking. The formatting backlog that made this advisory was cleared in
    # a dedicated style commit, so any new finding is a new finding.

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint:check

  integration:
    name: Migrations, integration and E2E (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      # Mirrors docker-compose.test.yml exactly — same image, same
      # credentials, same port — so a failure here reproduces locally with
      # `bun run test:db:up && bun run test:integration` and nothing else.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentalflow_test
          POSTGRES_PASSWORD: dentalflow_test
          POSTGRES_DB: dentalflow_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalflow_test -d dentalflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-a-real-secret
      WHATSAPP_VERIFY_TOKEN: ci-whatsapp-verify-token
      # The suite reads DATABASE_URL_TEST and validates it through
      # test/support/test-database.ts, which rejects any managed host and
      # refuses a URL identical to DATABASE_URL. The two below are
      # deliberately different databases so that guard is exercised, not
      # bypassed.
      DATABASE_URL: postgresql://dentalflow_test:dentalflow_test@127.0.0.1:5433/dentalflow_ci_unused
      DATABASE_URL_TEST: postgresql://dentalflow_test:dentalflow_test@127.0.0.1:5433/dentalflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      # Builds a throwaway database from nothing using the real migration
      # history, compares the result against schema.prisma, and replays the
      # corrective migrations over an existing database to prove they are
      # non-destructive. Never `db push`: that reads schema.prisma and never
      # opens prisma/migrations, which is exactly how a chain that could not
      # build an empty database survived for months.
      - name: Migration history
        run: bun run test:migrations

      # Both suites build their schema with `prisma migrate deploy`, so they
      # run against the same schema a deployment produces — including the
      # raw-SQL tenancy invariants (the one-owner-per-clinic partial unique
      # index and the role/clinic check constraint) that schema.prisma cannot
      # express and `db push` therefore never creates.
      - name: Database-backed integration tests
        run: bun run test:integration

      # Boots the application exactly as main.ts does and asserts on the
      # bootstrap itself: security headers, CORS policy, body-size limits,
      # route prefix and the global validation pipe.
      - name: End-to-end tests
        run: bun run test:e2e
